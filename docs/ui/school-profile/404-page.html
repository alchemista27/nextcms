<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found — SMaRT School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#0f7f6d', secondary: '#454545', accent: '#E3E8E7', graylight: '#F7F8F8' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; color: #4B5563; }
        .fade-in-section { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-in-section.is-visible { opacity: 1; transform: none; }
        .blob { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } 100% { transform: translateY(0px) rotate(0deg); } }
    </style>
</head>
<body class="bg-graylight antialiased h-screen flex flex-col">
    <!-- Navbar (Simplified) -->
    <header class="w-full z-50 bg-white shadow-sm flex-shrink-0">
        <div class="container mx-auto px-6 md:px-12 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center text-white"><span class="material-icons-outlined text-2xl">school</span></div>
                <div class="flex flex-col"><span class="font-bold text-2xl text-secondary leading-none">SMaRT</span><span class="text-xs font-semibold tracking-widest text-primary uppercase">School</span></div>
            </a>
            <a href="index.html" class="text-gray-500 hover:text-primary transition-colors font-semibold flex items-center gap-1"><span class="material-icons-outlined text-sm">home</span> Back to Home</a>
        </div>
    </header>

    <!-- 404 Content -->
    <main class="flex-grow flex items-center justify-center relative overflow-hidden">
        <!-- Background graphics -->
        <div class="absolute top-10 left-10 w-64 h-64 bg-primary/5 rounded-full filter blur-3xl blob"></div>
        <div class="absolute bottom-10 right-10 w-80 h-80 bg-accent/20 rounded-full filter blur-3xl blob" style="animation-delay: -3s;"></div>

        <div class="container mx-auto px-6 md:px-12 text-center relative z-10 fade-in-section is-visible">
            <h1 class="text-9xl font-black text-primary mb-4 drop-shadow-lg">404</h1>
            <h2 class="text-3xl md:text-4xl font-bold text-secondary mb-4">Oops! Page Not Found</h2>
            <p class="text-gray-500 mb-8 max-w-lg mx-auto">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            
            <form class="max-w-md mx-auto flex mb-8">
                <input type="text" placeholder="Search our site..." class="flex-1 border border-gray-200 rounded-l px-4 py-3 text-sm focus:outline-none focus:border-primary bg-white shadow-sm">
                <button type="submit" class="bg-primary text-white px-5 rounded-r hover:bg-secondary transition-colors shadow-sm"><span class="material-icons-outlined">search</span></button>
            </form>
            
            <div class="flex gap-4 justify-center">
                <a href="index.html" class="px-6 py-3 bg-secondary hover:bg-primary text-white rounded font-bold transition-colors flex items-center gap-2"><span class="material-icons-outlined text-sm">arrow_back</span> Return Home</a>
                <a href="contact.html" class="px-6 py-3 bg-white border border-gray-200 hover:border-primary hover:text-primary text-gray-600 rounded font-bold transition-colors">Contact Support</a>
            </div>
        </div>
    </main>
</body>
</html>
